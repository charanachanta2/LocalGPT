<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LocalGPT</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >

</head>

<body>

<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>


<main class="auth-wrapper">

    <section class="auth-card">

        <div class="logo">

            <div class="logo-mark">
                L
            </div>

            <span>
                LocalGPT
            </span>

        </div>


        {% if user_exists %}

        <h1>
            Welcome back
        </h1>

        <p class="subtitle">
            Sign in to your private local AI.
        </p>


        <form id="login-form">

            <label>
                Username
            </label>

            <input
                id="username"
                autocomplete="username"
                required
                placeholder="Enter your username"
            >


            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Enter your password"
            >


            <div
                id="error"
                class="error"
            ></div>


            <button type="submit">
                Sign in
            </button>

        </form>


        {% else %}


        <h1>
            Create LocalGPT
        </h1>

        <p class="subtitle">
            Create the owner account for your
            private local AI.
        </p>


        <form id="register-form">

            <label>
                Username
            </label>

            <input
                id="username"
                autocomplete="username"
                minlength="3"
                required
                placeholder="Choose a username"
            >


            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
                placeholder="At least 6 characters"
            >


            <label>
                Confirm password
            </label>

            <input
                id="confirm-password"
                type="password"
                autocomplete="new-password"
                required
                placeholder="Repeat your password"
            >


            <div
                id="error"
                class="error"
            ></div>


            <button type="submit">
                Create account
            </button>

        </form>


        {% endif %}


        <div class="privacy">

            <span class="status-dot"></span>

            Runs locally on your computer

        </div>

    </section>

</main>


<script>

const errorBox =
    document.getElementById("error");


const loginForm =
    document.getElementById("login-form");


const registerForm =
    document.getElementById("register-form");


function showError(message) {

    errorBox.textContent =
        message || "";
}


if (loginForm) {

    loginForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            showError("");


            const response =
                await fetch(
                    "/api/auth/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                username:
                                    document
                                    .getElementById(
                                        "username"
                                    )
                                    .value,

                                password:
                                    document
                                    .getElementById(
                                        "password"
                                    )
                                    .value
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                showError(
                    data.error
                );

                return;
            }


            window.location.href =
                "/";
        }
    );
}


if (registerForm) {

    registerForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            showError("");


            const username =
                document
                .getElementById(
                    "username"
                )
                .value;


            const password =
                document
                .getElementById(
                    "password"
                )
                .value;


            const confirm =
                document
                .getElementById(
                    "confirm-password"
                )
                .value;


            if (
                password !== confirm
            ) {

                showError(
                    "Passwords do not match."
                );

                return;
            }


            const response =
                await fetch(
                    "/api/auth/register",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                showError(
                    data.error
                );

                return;
            }


            window.location.href =
                "/";
        }
    );
}

</script>

</body>

</html>
